<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centerline SVG Converter</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Centerline SVG Converter</h1>
    <p class="tagline">
      Turns each drawn line into a <strong>single centerline vector</strong> &mdash;
      not two outline vectors with a fill.
    </p>
  </header>

  <main>
    <section class="panel controls">
      <div id="dropzone" class="dropzone">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <p>Drop an image here<br /><span>or click to browse</span></p>
      </div>

      <fieldset>
        <legend>Tracing options</legend>

        <label class="row">
          <span>Threshold</span>
          <input type="range" id="threshold" min="0" max="255" value="128" disabled />
          <input type="checkbox" id="autoThreshold" checked />
          <span class="hint">auto</span>
        </label>

        <label class="row checkbox">
          <input type="checkbox" id="invert" />
          <span>Invert (light lines on dark background)</span>
        </label>

        <label class="row">
          <span>Line merging</span>
          <input type="range" id="mergeAngle" min="0" max="160" step="5" value="75" />
          <output id="mergeAngleVal">75&deg;</output>
        </label>

        <label class="row">
          <span>Prune spurs</span>
          <input type="range" id="spurLength" min="0" max="30" step="1" value="6" />
          <output id="spurLengthVal">6</output>
        </label>

        <label class="row">
          <span>Smoothing</span>
          <input type="range" id="smoothing" min="0" max="1" step="0.05" value="1" />
          <output id="smoothingVal">1.00</output>
        </label>

        <label class="row">
          <span>Simplify</span>
          <input type="range" id="simplify" min="0" max="6" step="0.25" value="1.5" />
          <output id="simplifyVal">1.50</output>
        </label>

        <label class="row">
          <span>Despeckle</span>
          <input type="range" id="minObjectSize" min="0" max="100" step="1" value="12" />
          <output id="minObjectSizeVal">12</output>
        </label>

        <label class="row">
          <span>Stroke width</span>
          <input type="range" id="strokeWidth" min="0.5" max="12" step="0.5" value="2" disabled />
          <input type="checkbox" id="autoStroke" checked />
          <span class="hint">auto</span>
        </label>

        <label class="row">
          <span>Stroke color</span>
          <input type="color" id="strokeColor" value="#1f3d1f" />
        </label>
      </fieldset>

      <button id="convertBtn" disabled>Convert</button>
      <button id="downloadBtn" disabled>Download SVG</button>
      <p id="status" class="status"></p>
    </section>

    <section class="panel preview">
      <div class="preview-box">
        <h2>Original</h2>
        <div id="originalView" class="view"></div>
      </div>
      <div class="preview-box">
        <h2>Centerline SVG</h2>
        <div id="svgView" class="view"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
